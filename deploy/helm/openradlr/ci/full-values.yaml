# Every optional part switched on, rendered by `make helm-lint` in CI.
# The secret values are dummies.
publicUrl: https://ride.example.org
config:
  OPENRADLR_MAX_PLAYERS: 50
  OPENRADLR_STUDIO: true
secrets:
  stravaClientId: "123"
  stravaClientSecret: dummy-client-secret  # pragma: allowlist secret
  secretKey: dummy-key-at-least-16-chars  # pragma: allowlist secret
extraRoutes:
  my-route.json: |
    {"name": "x"}
ingress:
  enabled: true
  className: nginx
  tls: [{secretName: t, hosts: [ride.example.org]}]
metrics: {serviceMonitor: {enabled: true}}
