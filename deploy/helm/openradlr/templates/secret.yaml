{{- if and (not .Values.secrets.existingSecret) (include "openradlr.hasSecret" .) }}
{{- with .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openradlr.fullname" $ }}
  labels:
    {{- include "openradlr.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- if .stravaClientId }}
  {{ .keys.stravaClientId }}: {{ .stravaClientId | quote }}
  {{- end }}
  {{- if .stravaClientSecret }}
  {{ .keys.stravaClientSecret }}: {{ .stravaClientSecret | quote }}
  {{- end }}
  {{- if .secretKey }}
  {{- if lt (len .secretKey) 16 }}
  {{- fail "secrets.secretKey must be at least 16 characters" }}
  {{- end }}
  {{ .keys.secretKey }}: {{ .secretKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
