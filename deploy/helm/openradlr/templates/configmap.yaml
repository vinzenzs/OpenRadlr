apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openradlr.fullname" . }}
  labels:
    {{- include "openradlr.labels" . | nindent 4 }}
data:
  {{- if .Values.publicUrl }}
  OPENRADLR_PUBLIC_URL: {{ .Values.publicUrl | quote }}
  {{- if not (hasKey .Values.config "OPENRADLR_ALLOWED_ORIGINS") }}
  OPENRADLR_ALLOWED_ORIGINS: {{ .Values.publicUrl | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- if .Values.extraRoutes }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openradlr.fullname" . }}-routes
  labels:
    {{- include "openradlr.labels" . | nindent 4 }}
data:
  {{- range $file, $content := .Values.extraRoutes }}
  {{ $file }}: |
    {{- $content | trimSuffix "\n" | nindent 4 }}
  {{- end }}
{{- end }}
